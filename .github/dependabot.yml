version: 2
updates:
  - package-ecosystem: 'deno'
    directory: '/'
    schedule:
      interval: 'daily'

  # package.json only drives the Node.js/Bun test runs; keep its versions in step with deno.json.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 2

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
