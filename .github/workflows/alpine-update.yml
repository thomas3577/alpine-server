name: Alpine.js update check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Setup repo
        uses: actions/checkout@v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.6

      - name: Check for a newer Alpine.js release
        run: deno run --allow-net --allow-read --allow-write ./scripts/update-alpine-version.ts

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: 'chore: update Alpine.js'
          title: 'chore: update Alpine.js'
          body: |
            Automated update of `ALPINE_VERSION` produced by `scripts/update-alpine-version.ts`.

            Respects the 48h supply-chain delay: only versions published at least 48 hours ago are picked up.
          branch: chore/alpine-update
          delete-branch: true
